<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QWK</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="auth-body"><main class="auth-card"><div class="brand-mark">Q</div><h1>QWK</h1><p class="muted">{{ 'أنشئ حسابك وابدأ مجتمعك' if mode=='register' else 'مرحبًا بعودتك' }}</p>{% if error %}<div class="error">{{error}}</div>{% endif %}
<form method="post" action="{{ '/register' if mode=='register' else '/login' }}"><label>اسم المستخدم</label><input name="username" required minlength="3" maxlength="32" autocomplete="username" placeholder="Mish_01"><label>كلمة المرور</label><input name="password" type="password" required minlength="8" autocomplete="{{ 'new-password' if mode=='register' else 'current-password' }}" placeholder="8 أحرف على الأقل"><button class="primary full">{{ 'إنشاء الحساب' if mode=='register' else 'تسجيل الدخول' }}</button></form>
<p class="muted">{% if mode=='register' %}عندك حساب؟ <a href="/login">سجّل دخولك</a>{% else %}ما عندك حساب؟ <a href="/register">أنشئ حسابًا</a>{% endif %}</p></main></body></html>
